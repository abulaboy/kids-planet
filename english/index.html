<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>英文星球</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#e3fff3,#fff6d6 50%,#d9f3ff);min-height:100vh;color:#333}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#4cc9a6;color:#fff;box-shadow:0 4px 0 #2fa585}
header h1{margin:0;font-size:28px}
.stars{font-size:22px;background:#fff;color:#f39c12;border-radius:30px;padding:4px 14px;font-weight:bold;white-space:nowrap}
.btn{border:none;border-radius:22px;font-size:20px;font-weight:bold;padding:10px 18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);font-family:inherit;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.home{background:#fff;color:#2fa585}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px 12px 4px}
nav .btn{background:#fff;color:#555}
nav .btn.on{background:#ffb347;color:#fff}
main{padding:12px 16px 40px;max-width:1100px;margin:auto}
.sec{font-size:24px;margin:16px 0 8px;padding:6px 16px;border-radius:16px;display:inline-block;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{background:#fff;border-radius:22px;padding:10px 6px;text-align:center;cursor:pointer;box-shadow:0 5px 0 #ddd;border:4px solid transparent}
.tile .big{font-size:48px;font-weight:bold;line-height:1.1;font-family:"Comic Sans MS","Arial Rounded MT Bold",Arial,sans-serif}
.tile .e{font-size:40px;line-height:1.2}
.tile .w{font-size:22px;font-weight:bold;font-family:Arial,sans-serif}
.tile .zh{font-size:16px;color:#888}
.tile.on{border-color:#ffb347;animation:pop .4s}
.swatch{width:54px;height:54px;border-radius:50%;margin:4px auto;border:3px solid #eee}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.panel{background:#fff;border-radius:28px;padding:20px;text-align:center;box-shadow:0 6px 0 #eee;margin:10px 0 16px}
.panel p{font-size:20px;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:460px;margin:auto}
.opts .tile .e{font-size:70px}
.hide{display:none}
.note{font-size:15px;color:#888;text-align:center;margin-top:24px}
@media (max-width:520px){header h1{font-size:22px}.btn{font-size:17px;padding:8px 12px}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.tile .big{font-size:40px}}
</style>
</head>
<body>
<header><a class="btn home" href="../">🪐 星球</a><h1>🔤 英文星球</h1><span class="stars">⭐ <span id="star">0</span></span></header>
<nav>
<button class="btn on" data-v="abc">🔤 ABC</button>
<button class="btn" data-v="words">🍎 單字</button>
<button class="btn" data-v="quiz">👂 聽聽看</button>
</nav>
<main>
<section id="v-abc"><div class="grid" id="abc"></div></section>
<section id="v-words" class="hide"><div id="words"></div></section>
<section id="v-quiz" class="hide">
<div class="panel">
<p>聽英文，點出正確的圖！</p>
<button class="btn" style="background:#5aa9ff;color:#fff" id="again">🔊 再聽一次</button>
</div>
<div class="opts" id="opts"></div>
</section>
<p class="note">點一下卡片就會唸英文（使用裝置內建語音；沒有聲音的話，請確認手機沒有靜音）</p>
</main>
<script>
var ABC=[['A','apple','🍎','蘋果'],['B','ball','⚽','球'],['C','cat','🐱','貓'],['D','dog','🐶','狗'],['E','egg','🥚','蛋'],['F','fish','🐟','魚'],['G','grapes','🍇','葡萄'],['H','hat','🎩','帽子'],['I','ice cream','🍦','冰淇淋'],['J','juice','🧃','果汁'],['K','kite','🪁','風箏'],['L','lion','🦁','獅子'],['M','monkey','🐵','猴子'],['N','nose','👃','鼻子'],['O','orange','🍊','柳橙'],['P','pig','🐷','豬'],['Q','queen','👸','女王'],['R','rabbit','🐰','兔子'],['S','sun','☀️','太陽'],['T','tiger','🐯','老虎'],['U','umbrella','☂️','雨傘'],['V','violin','🎻','小提琴'],['W','watch','⌚','手錶'],['X','fox','🦊','狐狸（x 在字尾）'],['Y','yo-yo','🪀','溜溜球'],['Z','zebra','🦓','斑馬']];
var TOPICS=[
 ['顏色 Colors','#ff7aa2',[['red','紅色','#e63946'],['blue','藍色','#3a86ff'],['yellow','黃色','#ffd60a'],['green','綠色','#2a9d8f'],['orange','橘色','#fb8500'],['purple','紫色','#8e44ad'],['pink','粉紅色','#ff8fab'],['black','黑色','#222'],['white','白色','#fff'],['brown','咖啡色','#8b5a2b']]],
 ['數字 Numbers','#ffb347',[['one','一','1'],['two','二','2'],['three','三','3'],['four','四','4'],['five','五','5'],['six','六','6'],['seven','七','7'],['eight','八','8'],['nine','九','9'],['ten','十','10']]],
 ['動物 Animals','#4cc9a6',[['cat','貓','🐱'],['dog','狗','🐶'],['bird','鳥','🐦'],['fish','魚','🐟'],['duck','鴨子','🦆'],['cow','牛','🐮'],['pig','豬','🐷'],['horse','馬','🐴'],['elephant','大象','🐘'],['bear','熊','🐻']]],
 ['水果 Fruits','#5aa9ff',[['apple','蘋果','🍎'],['banana','香蕉','🍌'],['grapes','葡萄','🍇'],['orange','柳橙','🍊'],['strawberry','草莓','🍓'],['watermelon','西瓜','🍉'],['peach','桃子','🍑'],['lemon','檸檬','🍋'],['pineapple','鳳梨','🍍'],['cherry','櫻桃','🍒']]],
 ['身體 Body','#a77bff',[['eye','眼睛','👁️'],['ear','耳朵','👂'],['nose','鼻子','👃'],['mouth','嘴巴','👄'],['hand','手','✋'],['foot','腳','🦶']]]
];
var stars=0;try{stars=+localStorage.getItem('kp-en-stars')||0}catch(e){}
var starEl=document.getElementById('star');starEl.textContent=stars;
function addStar(){stars++;starEl.textContent=stars;try{localStorage.setItem('kp-en-stars',stars)}catch(e){}}
var voice=null;
function pickVoice(){var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]/i.test(v.lang)});voice=vs.find(function(v){return /en[-_]US/i.test(v.lang)&&/female|samantha|aria|jenny|google us/i.test(v.name)})||vs.find(function(v){return /en[-_]US/i.test(v.lang)})||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}
function flash(el){el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}
function tile(html,speak){var d=document.createElement('div');d.className='tile';d.innerHTML=html;d.onclick=function(){flash(d);say(speak)};return d}
var abc=document.getElementById('abc');
ABC.forEach(function(a){abc.appendChild(tile('<div class="big">'+a[0]+' '+a[0].toLowerCase()+'</div><div class="e">'+a[2]+'</div><div class="w">'+a[1]+'</div><div class="zh">'+a[3]+'</div>',a[0]+'. '+a[1]))});
var words=document.getElementById('words');
TOPICS.forEach(function(t){var h=document.createElement('div');h.className='sec';h.style.background=t[1];h.textContent=t[0];words.appendChild(h);var g=document.createElement('div');g.className='grid';
 t[2].forEach(function(w){var pic=w[2].charAt(0)==='#'?'<div class="swatch" style="background:'+w[2]+'"></div>':/^\d+$/.test(w[2])?'<div class="big">'+w[2]+'</div>':'<div class="e">'+w[2]+'</div>';g.appendChild(tile(pic+'<div class="w">'+w[0]+'</div><div class="zh">'+w[1]+'</div>',w[0]))});words.appendChild(g)});
// 聽聽看：從有圖的單字出題
var POOL=[];TOPICS.forEach(function(t){t[2].forEach(function(w){if(w[2].charAt(0)!=='#'&&!/^\d+$/.test(w[2]))POOL.push(w)})});
var ans=null,busy=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function next(){busy=false;var picks=shuffle(POOL.slice()).filter(function(w,i,arr){return arr.findIndex(function(x){return x[2]===w[2]})===i}).slice(0,4);ans=picks[Math.random()*4|0];var o=document.getElementById('opts');o.innerHTML='';
 picks.forEach(function(w){var d=document.createElement('div');d.className='tile';d.innerHTML='<div class="e">'+w[2]+'</div>';d.onclick=function(){if(busy)return;if(w===ans){busy=true;flash(d);addStar();say('Great! '+w[0]);setTimeout(next,1400)}else{d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');say(w[0])}};o.appendChild(d)});
 setTimeout(function(){say(ans[0])},300)}
document.getElementById('again').onclick=function(){if(ans)say(ans[0])};
function show(v){['abc','words','quiz'].forEach(function(k){document.getElementById('v-'+k).classList.toggle('hide',k!==v)});document.querySelectorAll('nav .btn').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});if(v==='quiz')next();else speechSynthesis&&speechSynthesis.cancel()}
document.querySelectorAll('nav .btn').forEach(function(b){b.onclick=function(){show(b.dataset.v);history.replaceState(null,'','#'+b.dataset.v)}});
function fromHash(){var h=location.hash.slice(1);show(h==='words'||h==='quiz'?h:'abc')}
addEventListener('hashchange',fromHash);if(location.hash)fromHash();
</script>
</body>
</html>
