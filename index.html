<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學習星球</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#fff6d6,#ffe0ec 50%,#d9f3ff);min-height:100vh;color:#333}
header{padding:22px 18px 14px;text-align:center}
header h1{margin:0;font-size:40px;color:#ff6b8b;text-shadow:0 3px 0 #fff}
header p{margin:6px 0 0;font-size:20px;color:#666}
main{padding:10px 16px 40px;max-width:1000px;margin:auto}
.area{background:#fff;border-radius:30px;padding:20px;margin:18px 0;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.area h2{margin:0 0 4px;font-size:30px}
.area>p{margin:0 0 14px;font-size:18px;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:block;border-radius:26px;padding:20px;color:#fff;text-decoration:none;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.15);transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.card .emo{font-size:60px;line-height:1.1}
.card b{display:block;font-size:26px;margin:6px 0 2px}
.card span{font-size:17px}
.c1{background:#ff7aa2}.c2{background:#ffb347}.c3{background:#4cc9a6}.c4{background:#5aa9ff}
.soon{background:#c9ced6;pointer-events:none}
footer{text-align:center;font-size:14px;color:#888;padding:0 16px 24px}
footer a{color:#888}
</style>
</head>
<body>
<header>
<h1>🪐 學習星球</h1>
<p>選一個星球開始玩吧！</p>
</header>
<main>
<section class="area">
<h2>ㄅ 注音星球</h2>
<p>國小一年級注音：認符號、聽發音、拼拼看</p>
<div class="grid">
<a class="card c1" href="zhuyin/"><div class="emo">📘</div><b>康軒首冊版</b><span>跟著課本的順序學</span></a>
<a class="card c2" href="zhuyin/general/"><div class="emo">🎈</div><b>一般版</b><span>37 個注音符號全部玩</span></a>
</div>
</section>
<section class="area">
<h2>A 英文星球</h2>
<p>字母、發音和生活單字，點一下就會唸</p>
<div class="grid">
<a class="card c1" href="english/phonics2/"><div class="emo">🐱</div><b>課本短母音</b><span>自然發音 2・Unit 1–8</span></a>
<a class="card c3" href="english/"><div class="emo">🔤</div><b>ABC 字母</b><span>26 個字母和單字</span></a>
<a class="card c4" href="english/#words"><div class="emo">🍎</div><b>生活單字</b><span>顏色、數字、動物、水果</span></a>
</div>
</section>
<section class="area">
<h2>🐞 拆解星球</h2>
<p>把七星瓢蟲拆開來，認識頭、胸、腹和六隻腳</p>
<div class="grid">
<a class="card c1" href="teardown/"><div class="emo">🐞</div><b>七星瓢蟲</b><span>3D 拆開看、點一點</span></a>
</div>
</section>
</main>
<footer>注音錄音：教育部（<a href="https://creativecommons.org/licenses/by/4.0/deed.zh_TW">CC BY 4.0</a>）・英文發音使用裝置內建語音</footer>
</body>
</html>
