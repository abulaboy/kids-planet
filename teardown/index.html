<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const canvas = $('c');
const stage = $('stage');
const card = $('card');
const nameEl = $('name');
const blurb = $('blurb');
const loading = $('loading');
const explodeBtn = $('explodeBtn');
const quizBtn = $('quizBtn');
const speakBtn = $('speakBtn');
const quizBlock = $('quizBlock');
const quizLabel = $('quizLabel');
const quizAsk = $('quizAsk');
const quizHint = $('quizHint');

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CN = ['零','一','二','三','四','五'];

function rubyHTML(pairs) {
  return pairs.map(([c, z]) => `<ruby>${c}<rt>${z}</rt></ruby>`).join('');
}
function setRubyButton(btn, pairs, label) {
  btn.innerHTML = rubyHTML(pairs);
  btn.setAttribute('aria-label', label);
}

const BTN = {
  open: [[['拆','ㄔㄞ'],['開','ㄎㄞ']], '拆開'],
  close: [[['合','ㄏㄜˊ'],['起','ㄑㄧˇ'],['來','ㄌㄞˊ']], '合起來'],
  quiz: [[['小','ㄒㄧㄠˇ'],['問','ㄨㄣˋ'],['答','ㄉㄚˊ']], '小問答'],
  stop: [[['結','ㄐㄧㄝˊ'],['束','ㄕㄨˋ']], '結束'],
  again: [[['再','ㄗㄞˋ'],['玩','ㄨㄢˊ'],['一','ㄧˊ'],['次','ㄘˋ']], '再玩一次'],
};

const INFO = {
  intro: {
    ruby: [['七','ㄑㄧ'],['星','ㄒㄧㄥ'],['瓢','ㄆㄧㄠˊ'],['蟲','ㄔㄨㄥˊ']],
    blurb: '點一點牠的身體，看看每個部位。按「拆開」，部位會飛開來。',
    speech: '七星瓢蟲。點一點牠的身體，看看每個部位。也可以按拆開。',
  },
  head: {
    ruby: [['頭','ㄊㄡˊ']],
    blurb: '頭在身體最前面。頭上有觸角、複眼和口器。',
    speech: '頭。頭在身體最前面。頭上有觸角、複眼和口器。',
  },
  antenna: {
    ruby: [['觸','ㄔㄨˋ'],['角','ㄐㄧㄠˇ']],
    blurb: '觸角長在頭上，可以聞味道、找朋友。瓢蟲的觸角短短的，末端圓圓的。',
    speech: '觸角。觸角長在頭上，可以聞味道、找朋友。',
  },
  eye: {
    ruby: [['複','ㄈㄨˋ'],['眼','ㄧㄢˇ']],
    blurb: '複眼長在頭的兩邊。裡面有好多小眼睛，一次看得到很寬的地方。',
    speech: '複眼。複眼長在頭的兩邊，裡面有好多小眼睛。',
  },
  mouth: {
    ruby: [['口','ㄎㄡˇ'],['器','ㄑㄧˋ']],
    blurb: '口器就是嘴巴。瓢蟲用它咬小蟲，這樣可以幫助植物長大。',
    speech: '口器。口器就是嘴巴。瓢蟲用它咬小蟲，幫助植物長大。',
  },
  thorax: {
    ruby: [['胸','ㄒㄩㄥ'],['部','ㄅㄨˋ']],
    blurb: '胸部在頭和腹部中間。六隻腳和兩對翅膀，都長在胸部。',
    speech: '胸部。胸部在中間。六隻腳和翅膀都長在胸部。',
  },
  abdomen: {
    ruby: [['腹','ㄈㄨˋ'],['部','ㄅㄨˋ']],
    blurb: '腹部在身體後面，一節一節的。吃進去的食物在這裡消化。',
    speech: '腹部。腹部在身體後面，一節一節的，用來消化食物。',
  },
  elyL: {
    ruby: [['左','ㄗㄨㄛˇ'],['前','ㄑㄧㄢˊ'],['翅','ㄔˋ']],
    blurb: '這片紅色硬殼是前翅，也叫鞘翅 ㄑㄧㄠˋ ㄔˋ。它硬硬的，用來保護軟軟的後翅和腹部。七星瓢蟲有七個黑點。',
    speech: '左前翅。這片紅色硬殼是前翅，也叫鞘翅。用來保護身體。七星瓢蟲有七個黑點。',
  },
  elyR: {
    ruby: [['右','ㄧㄡˋ'],['前','ㄑㄧㄢˊ'],['翅','ㄔˋ']],
    blurb: '這片紅色硬殼是前翅，也叫鞘翅 ㄑㄧㄠˋ ㄔˋ。它硬硬的，用來保護軟軟的後翅和腹部。七星瓢蟲有七個黑點。',
    speech: '右前翅。這片紅色硬殼是前翅，也叫鞘翅。用來保護身體。七星瓢蟲有七個黑點。',
  },
  hindL: {
    ruby: [['左','ㄗㄨㄛˇ'],['後','ㄏㄡˋ'],['翅','ㄔˋ']],
    blurb: '後翅薄薄透透的，平常收在紅色硬殼下面。要飛的時候才打開放開來。',
    speech: '左後翅。後翅薄薄透透的，平常收在紅色殼下面，飛的時候才打開。',
  },
  hindR: {
    ruby: [['右','ㄧㄡˋ'],['後','ㄏㄡˋ'],['翅','ㄔˋ']],
    blurb: '後翅薄薄透透的，平常收在紅色硬殼下面。要飛的時候才打開放開來。',
    speech: '右後翅。後翅薄薄透透的，平常收在紅色殼下面，飛的時候才打開。',
  },
};

function legInfo(pairs, said) {
  return {
    ruby: pairs,
    blurb: '這是一隻腳。昆蟲都有六隻腳，三對全都長在胸部，不長在腹部。',
    speech: said + '。這是一隻腳。昆蟲都有六隻腳，全都長在胸部。',
  };
}
INFO.legFL = legInfo([['左','ㄗㄨㄛˇ'],['前','ㄑㄧㄢˊ'],['腳','ㄐㄧㄠˇ']], '左前腳');
INFO.legFR = legInfo([['右','ㄧㄡˋ'],['前','ㄑㄧㄢˊ'],['腳','ㄐㄧㄠˇ']], '右前腳');
INFO.legML = legInfo([['左','ㄗㄨㄛˇ'],['中','ㄓㄨㄥ'],['腳','ㄐㄧㄠˇ']], '左中腳');
INFO.legMR = legInfo([['右','ㄧㄡˋ'],['中','ㄓㄨㄥ'],['腳','ㄐㄧㄠˇ']], '右中腳');
INFO.legHL = legInfo([['左','ㄗㄨㄛˇ'],['後','ㄏㄡˋ'],['腳','ㄐㄧㄠˇ']], '左後腳');
INFO.legHR = legInfo([['右','ㄧㄡˋ'],['後','ㄏㄡˋ'],['腳','ㄐㄧㄠˇ']], '右後腳');

const QUESTIONS = [
  { part: 'antenna', ask: '點點看，哪個是觸角？', ok: '答對了！觸角長在頭上。', hint: '觸角是頭上兩根短短的鬚鬚。', tip: '頭上短短的兩根。' },
  { part: 'eye', ask: '點點看，哪個是複眼？', ok: '答對了！複眼長在頭的兩邊。', hint: '複眼是頭兩邊，有很多小格子的眼睛。', tip: '找找頭的兩邊。' },
  { part: 'thorax', ask: '六隻腳長在哪裡？點一點。', ok: '答對了！昆蟲的腳都長在胸部。', hint: '胸部在頭和腹部中間。', tip: '不是腳本身，是長腳的地方。' },
  { part: 'elytron', ask: '紅色硬硬的殼是什麼？點一點。', ok: '答對了！那是前翅，用來保護身體。', hint: '紅色的硬殼其實是翅膀喔。', tip: '看看紅色的背殼。' },
  { part: 'abdomen', ask: '點點看，哪個是腹部？', ok: '答對了！腹部在身體後面。', hint: '腹部在後面，一節一節的。看不清楚就按拆開。', tip: '看不清楚，可以先按拆開。' },
];

let currentSpeech = INFO.intro.speech;
let quiz = null;
let selected = null;

function showInfo(info) {
  nameEl.hidden = false;
  blurb.hidden = false;
  nameEl.innerHTML = rubyHTML(info.ruby);
  blurb.textContent = info.blurb;
  currentSpeech = info.speech;
}
function showIntro() {
  selected = null;
  showInfo(INFO.intro);
  document.body.dataset.part = 'intro';
}

let voice = null;
function refreshVoice() {
  if (!window.speechSynthesis) return;
  const list = speechSynthesis.getVoices();
  voice = list.find((v) => /zh[-_]TW/i.test(v.lang))
    || list.find((v) => /Mei-Jia|Ting-Ting|Tingting/i.test(v.name))
    || list.find((v) => /^zh/i.test(v.lang))
    || null;
}
if (window.speechSynthesis) {
  refreshVoice();
  speechSynthesis.onvoiceschanged = refreshVoice;
}
function utterance(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.9;
  u.pitch = 1.04;
  if (voice) u.voice = voice;
  return u;
}
function speakParts(parts) {
  if (!window.speechSynthesis) return;
  const lines = parts.filter(Boolean);
  if (!lines.length) return;
  const synth = speechSynthesis;
  synth.resume();
  synth.cancel();
  lines.forEach((line) => synth.speak(utterance(line)));
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance',
  });
} catch (err) {
  loading.textContent = '這個裝置沒辦法顯示 3D。請換一台手機或電腦試試看。';
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.08, 80);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.52, 0.05);
controls.enablePan = false;
controls.enableDamping = false;
controls.dampingFactor = 0.08;
controls.minDistance = 3.3;
controls.maxDistance = 18;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.58;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.85;

const hemi = new THREE.HemisphereLight(0xfff8ee, 0x8ed48a, 0.95);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff7ee, 1.25);
key.position.set(4.5, 9.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 28;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key);
const fill = new THREE.DirectionalLight(0xd7ecff, 0.55);
fill.position.set(-6, 4, -3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe0ea, 0.35);
rim.position.set(-2, 5, -6);
scene.add(rim);

function plastic(color, opts = {}) {
  const m = new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.46,
    metalness: opts.metalness ?? 0.04,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    map: opts.map ?? null,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1,
    side: opts.side ?? THREE.FrontSide,
    depthWrite: opts.depthWrite ?? true,
  });
  m.userData.baseEmissive = m.emissive.clone();
  m.userData.baseIntensity = m.emissiveIntensity;
  if (opts.wing) m.userData.isWing = true;
  return m;
}

const geoCache = new Map();
function sphere(r, w = 18, h = 14) {
  const key = r + ':' + w + ':' + h;
  if (!geoCache.has(key)) geoCache.set(key, new THREE.SphereGeometry(r, w, h));
  return geoCache.get(key);
}

const hitMat = new THREE.MeshBasicMaterial({
  transparent: true, opacity: 0, depthWrite: false, colorWrite: false,
});
function hitbox(parent, radius, at) {
  const mesh = new THREE.Mesh(sphere(radius, 10, 8), hitMat);
  mesh.position.set(at[0], at[1], at[2]);
  mesh.userData.hitbox = true;
  parent.add(mesh);
}

function buildChain(parent, points, radii, material) {
  const vs = points.map((p) => new THREE.Vector3(p[0], p[1], p[2]));
  vs.forEach((v, i) => {
    const ball = new THREE.Mesh(sphere(radii[i], 12, 10), material);
    ball.position.copy(v);
    parent.add(ball);
  });
  for (let i = 0; i < vs.length - 1; i++) {
    const dist = vs[i].distanceTo(vs[i + 1]);
    const r = Math.min(radii[i], radii[i + 1]) * 0.78;
    const len = Math.max(0.02, dist - r * 2);
    const limb = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 8), material);
    limb.position.copy(vs[i]).add(vs[i + 1]).multiplyScalar(0.5);
    limb.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vs[i + 1].clone().sub(vs[i]).normalize());
    parent.add(limb);
  }

function makeEyeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#6a2c1c';
  g.fillRect(0, 0, 256, 256);
  const step = 22;
  for (let row = 0; row < 14; row++) {
    for (let col = 0; col < 14; col++) {
      const x = 8 + col * step + (row % 2) * step * 0.5;
      const y = 8 + row * step * 0.86;
      g.beginPath();
      g.fillStyle = (row + col) % 2 === 0 ? '#8d4030' : '#4e1c12';
      g.arc(x, y, 8, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.fillStyle = 'rgba(255, 220, 160, 0.7)';
      g.arc(x - 2.4, y - 2.4, 2.5, 0, Math.PI * 2);
      g.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return tex;
}
function makeAbdomenTexture() {
  const c = document.createElement('canvas');
  c.width = 128;
  c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#ff9a3c';
  g.fillRect(0, 0, 128, 256);
  g.fillStyle = '#a85a28';
  for (let i = 0; i < 6; i++) g.fillRect(0, 28 + i * 34, 128, 4);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function mirrorX(geo) {
  const g = geo.clone();
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setX(i, -pos.getX(i));
  const idx = g.index;
  if (idx) {
    const a = idx.array;
    for (let i = 0; i < a.length; i += 3) {
      const t = a[i + 1];
      a[i + 1] = a[i + 2];
      a[i + 2] = t;
    }
    idx.needsUpdate = true;
  }
  g.computeVertexNormals();
  return g;
}

function adopt(group, spec) {
  group.userData.partId = spec.id;
  group.userData.infoKey = spec.info;
  group.userData.pair = !!spec.pair;
  group.userData.home = group.position.clone();
  group.userData.offset = new THREE.Vector3(...(spec.offset || [0, 0, 0]));
  group.userData.homeRot = { x: group.rotation.x, y: group.rotation.y, z: group.rotation.z };
  group.userData.openRot = spec.openRot || { x: 0, y: 0, z: 0 };
  group.userData.sway = !!spec.sway;
  group.userData.wing = !!spec.wing;
  group.userData.phase = partGroups.length * 0.7;
  group.name = spec.info;
  group.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = !o.userData.hitbox && !spec.wing;
    o.receiveShadow = !o.userData.hitbox && !spec.wing;
    o.userData.partId = spec.id;
    o.userData.partRoot = group;
    pickables.push(o);
    const mats = [].concat(o.material || []);
    mats.forEach((m) => {
      if (m && m.emissive && !m.userData.baseEmissive) {
        m.userData.baseEmissive = m.emissive.clone();
        m.userData.baseIntensity = m.emissiveIntensity || 0;

  partGroups.push(group);
  bug.add(group);
}

  if (!selected) return false;

function onEllipsoid(x, y, z) {
  const ix = x / SHELL.sx;
  const iy = y / SHELL.sy;
  const iz = z / SHELL.sz;
  const len = Math.hypot(ix, iy, iz) || 1;
  return new THREE.Vector3((ix / len) * SHELL.sx, (iy / len) * SHELL.sy, (iz / len) * SHELL.sz);

const homeDir = new THREE.Vector3(0.72, 1.9, 2.05).normalize();

function frameCamera(t) {
  const w = Math.max(1, stage.clientWidth);
  const h = Math.max(1, stage.clientHeight);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const vFov = (camera.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const halfW = 2.15 + 1.75 * t;
  const halfH = 1.55 + 1.0 * t;
  const dist = Math.max(halfW / Math.tan(hFov / 2), halfH / Math.tan(vFov / 2));
  camera.position.copy(controls.target).addScaledVector(homeDir, dist);
  camera.lookAt(controls.target);
}

let toOpen = false;
let fromT = 0;
let tweenStart = performance.now();
function explodeValue(now) {
  const dur = reduceMotion ? 1 : 920;
  const u = Math.min(1, (now - tweenStart) / dur);
  const e = u < 0.5 ? 4 * u * u * u : 1 - ((-2 * u + 2) ** 3) / 2;
  return fromT + ((toOpen ? 1 : 0) - fromT) * e;
}

    g.rotation.set(hr.x + orot.x * t, hr.y + orot.y * t, z);

    g.scale.setScalar(on ? 1.07 : 1);
    if (g.userData.wing) {

      g.visible = fade > 0.04;
    }
    g.traverse((o) => {

        if (on) {
          m.emissive.set(0xffe45a);
          m.emissiveIntensity = 0.55 + Math.sin(now * 0.006 + g.userData.phase) * 0.22;
          m.userData.wasLit = true;
        } else if (m.userData.wasLit) {
          m.emissive.copy(m.userData.baseEmissive);
          m.emissiveIntensity = m.userData.baseIntensity;
          m.userData.wasLit = false;
        }
      });
    });
  });
  const sun = scene.userData.sun;
  if (sun) sun.rotation.z = now * 0.00035;
  (scene.userData.clouds || []).forEach((cloud) => {
    cloud.position.x = cloud.userData.baseX + Math.sin(now * 0.00018 + cloud.userData.phase) * 0.25;
  });
}

function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  renderer.setSize(Math.max(1, w), Math.max(1, h), false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const pointers = new Set();
let multi = false;
let down = null;
canvas.addEventListener('pointerdown', (e) => {
  pointers.add(e.pointerId);
  if (pointers.size > 1) multi = true;
  down = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointercancel', (e) => pointers.delete(e.pointerId));
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerup', (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size > 0) return;
  const wasMulti = multi;
  multi = false;
  if (wasMulti || !down) return;
  const dx = e.clientX - down.x;
  const dy = e.clientY - down.y;
  down = null;
  if (dx * dx + dy * dy > 12 * 12) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false).filter((hit) => {
    for (let o = hit.object; o; o = o.parent) if (o.visible === false) return false;
    return true;
  });
  if (!hits.length) return;
  const root = hits[0].object.userData.partRoot;
  if (root) select(root);
});

function select(group) {
  selected = group;
  const info = INFO[group.userData.infoKey];
  document.body.dataset.part = group.userData.infoKey;
  if (quiz && quiz.active) {
    showInfo(info);
    judge(group.userData.partId);
    return;
  }
  if (quiz && !quiz.active) {
    quizBlock.hidden = true;
    setRubyButton(quizBtn, BTN.quiz[0], BTN.quiz[1]);
    quizBtn.setAttribute('aria-pressed', 'false');
    quiz = null;
    document.body.dataset.quiz = 'off';
  }
  showInfo(info);
  speakParts([info.speech]);
}

function cheer() {
  if (reduceMotion) return;
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('div');
    el.className = 'cheer';
    el.textContent = ['⭐', '🌟', '✨'][i % 3];
    el.style.left = (28 + ((i * 17) % 48)) + '%';
    el.style.animationDelay = (i * 0.05) + 's';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
}

function showQuestion(doSpeak) {
  selected = null;
  nameEl.hidden = true;
  blurb.hidden = true;
  const q = QUESTIONS[quiz.i];
  quiz.wrong = false;
  quiz.locked = false;
  quizLabel.textContent = '第 ' + (quiz.i + 1) + ' 題，共 ' + QUESTIONS.length + ' 題';
  quizAsk.textContent = q.ask;
  quizHint.textContent = q.tip;
  quizHint.classList.remove('bad');
  document.body.dataset.part = '';
  if (doSpeak) speakParts([q.ask]);
}
function finishQuiz() {
  const n = quiz.score;
  quiz.active = false;
  quizLabel.textContent = '問答結束';
  quizAsk.textContent = '五題裡答對 ' + n + ' 題';
  quizHint.textContent = n >= 4 ? '你真的看清楚了！' : '再玩一次，會更熟喔。';
  quizHint.classList.remove('bad');
  const ruby = n === 5
    ? [['全','ㄑㄩㄢˊ'],['對','ㄉㄨㄟˋ'],['了','˙ㄌㄜ']]
    : n >= 4
      ? [['好','ㄏㄠˇ'],['棒','ㄅㄤˋ']]
      : [['再','ㄗㄞˋ'],['試','ㄕˋ'],['一','ㄧˊ'],['次','ㄘˋ']];
  nameEl.hidden = false;
  blurb.hidden = false;
  nameEl.innerHTML = rubyHTML(ruby);
  blurb.textContent = n >= 4
    ? '六隻腳都長在胸部，紅色硬殼是前翅。'
    : '可以再玩一次，找找觸角、複眼、胸部、前翅和腹部。';
  currentSpeech = '問答結束。五題裡，你答對了' + CN[n] + '題。';
  setRubyButton(quizBtn, BTN.again[0], BTN.again[1]);
  quizBtn.setAttribute('aria-pressed', 'false');
  document.body.dataset.quiz = 'done';
  document.body.dataset.score = String(n);
}
function judge(partId) {
  if (!quiz || !quiz.active || quiz.locked) return;
  const q = QUESTIONS[quiz.i];
  if (partId === q.part) {
    if (!quiz.wrong) quiz.score += 1;
    quiz.locked = true;
    cheer();
    quizHint.textContent = q.ok;
    quizHint.classList.remove('bad');
    const token = quiz.token;
    const next = QUESTIONS[quiz.i + 1];
    if (next) speakParts([q.ok, next.ask]);
    else speakParts([q.ok + '問答結束。五題裡，你答對了' + CN[quiz.score] + '題。']);
    setTimeout(() => {
      if (!quiz || quiz.token !== token || !quiz.active) return;
      if (!next) finishQuiz();
      else {
        quiz.i += 1;
        showQuestion(false);
      }
    }, 1500);
  } else {
    quiz.wrong = true;
    quizHint.textContent = q.hint;
    quizHint.classList.add('bad');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    speakParts(['再找找。' + q.hint]);
  }
}
function startQuiz() {
  quiz = { active: true, i: 0, score: 0, wrong: false, locked: false, token: 1 };
  quizBlock.hidden = false;
  setRubyButton(quizBtn, BTN.stop[0], BTN.stop[1]);
  quizBtn.setAttribute('aria-pressed', 'true');
  document.body.dataset.quiz = 'on';
  document.body.dataset.score = '';
  showQuestion(true);
}
function stopQuiz() {
  if (quiz) quiz.token += 1;
  quiz = null;
  quizBlock.hidden = true;
  setRubyButton(quizBtn, BTN.quiz[0], BTN.quiz[1]);
  quizBtn.setAttribute('aria-pressed', 'false');
  document.body.dataset.quiz = 'off';
  if (nameEl.hidden) showIntro();
  speakParts(['問答先停下來。你可以再點點看。']);
}

explodeBtn.addEventListener('click', () => {
  fromT = explodeValue(performance.now());
  toOpen = !toOpen;
  tweenStart = performance.now();
  explodeBtn.setAttribute('aria-pressed', String(toOpen));
  document.body.dataset.explode = toOpen ? 'open' : 'closed';
  const spec = toOpen ? BTN.close : BTN.open;
  setRubyButton(explodeBtn, spec[0], spec[1]);
});
quizBtn.addEventListener('click', () => {
  if (quiz && quiz.active) stopQuiz();
  else startQuiz();
});
speakBtn.addEventListener('click', () => {
  if (quiz && quiz.active) {
    const q = QUESTIONS[quiz.i];
    speakParts([q.ask + (quiz.wrong ? q.hint : '')]);
  } else speakParts([currentSpeech]);
});

showIntro();

let raf = 0;
let running = true;
let showed = false;
function loop(now) {
  if (!running) return;
  const t = explodeValue(now);
  pose(t, now);
  if (!userMoved) frameCamera(t);
  controls.update();
  renderer.render(scene, camera);
  if (!showed && stage.clientHeight > 40) {
    showed = true;
    loading.hidden = true;
    document.body.dataset.ready = '1';
  }
  raf = requestAnimationFrame(loop);
}
raf = requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    cancelAnimationFrame(raf);
  } else if (!running) {
    running = true;
    raf = requestAnimationFrame(loop);
  }
});
</script>
<script>
setTimeout(() => {
  const el = document.getElementById('loading');
  if (el && !el.hidden) el.textContent = '請重新整理一次。需要網路才能把瓢蟲畫出來。';
}, 12000);
</script>
